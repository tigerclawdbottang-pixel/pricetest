name: 自动采集价格数据

on:
  schedule:
    # 每天 UTC 00:00 和 12:00 运行（北京时间 08:00 和 20:00）
    - cron: '0 0,12 * * *'
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 采集价格数据
        run: python3 scripts/collect.py
        continue-on-error: true  # 部分源失败不阻塞

      - name: 生成站点
        run: |
          # 不内置 AI 密钥（公开仓库）
          MODELPRICE_EMBED_KEY=0 python3 scripts/build_site.py

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无数据变化，跳过提交"
          else
            git commit -m "自动更新价格数据 $(date -u +%Y-%m-%d)"
            git push
          fi
